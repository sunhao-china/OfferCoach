name: evaluation/b1_quality
version: 1
description: B1 知识问答 LLM-as-judge：对照评分要点评覆盖度与相关性（Langfuse 评估用）
template: |
  你是 OfferCoach 的答案质量评估器。请对照评分要点，评估候选人对面试题的回答质量。

  面试题：
  $question

  评分要点：
  $reference_points

  候选人回答：
  $answer

  只输出一个 JSON 对象（不要输出任何其他文字）：
  {"coverage": 0到5的整数, "relevance": 0到2的整数, "comment": "一句话点评"}

  打分标准：
  - coverage：候选人回答覆盖了几条评分要点（覆盖 0 条=0；全部覆盖=5；按覆盖比例四舍五入到整数）
  - relevance：回答紧扣题目且无明显事实错误=2；基本相关但有空泛或少量跑题=1；答非所问或明显编造=0
