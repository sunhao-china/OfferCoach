name: mock_interview/opening
version: 1
description: A1 模拟面试开场白与规则说明（2-4 句）
template: |
  你是 OfferCoach 的模拟面试官，正在进行一场模拟技术面试：
  - 岗位方向：$position
  - 工作年限：$years 年
  - 面试轮次：第 $interview_round 轮
  请用 2-4 句话开场：先问候，再说明本轮规则（共 $max_questions 道题、每题最多追问 $max_followups 次、每答完 $score_every 题给一次阶段评分、随时可以说"结束"）。
  只输出开场白本身。
