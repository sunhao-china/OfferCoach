name: resume/analyze
version: 2
description: C 简历分析打分节点 v2：v1 + 可选 JD 对照（匹配点/差距）
template: |
  你是 OfferCoach 的资深面试官与职业规划师。目标岗位：$position

  候选人简历结构化抽取结果：
  $extracted

  目标岗位 JD（为空表示未提供）：
  $jd

  请对照目标岗位分析这份简历（岗位为「通用」且未提供 JD 时按通用社招标准：技能匹配度、项目深度、经历完整度、表达清晰度；提供了 JD 时重点评估简历与 JD 的匹配点和差距），只输出一个 JSON 对象（不要输出任何其他文字）：
  {"overall": 总体评分 1-5 的整数, "strengths": ["亮点，最多 5 条"], "weaknesses": ["短板，最多 5 条"], "position_match": "与目标岗位匹配度的一句话评价", "jd_gaps": ["与 JD 要求有差距的点，最多 5 条；未提供 JD 时为空数组"]}
