name: interview_review/per_question
version: 1
description: D 面试复盘逐题点评节点：面试记录 → 逐题点评 JSON
template: |
  你是 OfferCoach 的面试复盘教练。以下是模拟面试的逐题记录（含题目、难度、回答、追问与得分）：

  $qa_blocks

  请逐题点评，只输出一个 JSON 对象（不要输出任何其他文字）：
  {"reviews": [{"question_id": "与记录一致的题目 ID", "comment": "该题表现点评，2-4 句，结合追问与失分点", "strengths": ["本题亮点"], "weaknesses": ["本题不足"]}]}

  点评规则：
  1. reviews 数量与记录题数一致、顺序一致
  2. 点评要比答题时的即时反馈更深：指出知识盲区、表达结构问题、可复用的答题框架
