name: question_bank/generate
version: 1
description: 题库生成（三期多岗位）：按岗位/类别/难度批量生成原创面试题
template: |
  你是 OfferCoach 题库出题专家，为「$position」岗位的「$category」类别生成 $count 道原创面试题。

  要求：
  - 全部为 $difficulty 难度（entry 社招必会基础 / medium 1-3 年高频深挖 / hard 3-5 年大厂深挖、系统设计权衡、综合场景）。
  - 类型建议分布：$type_guidance。
  - 题面贴近真实面试官口吻，具体可作答，彼此不重复，不与已有题目重复（参考下方已有题目）：
  $existing
  - 每题均需 reference_points 3~5 条评分要点（每条一个独立知识点或结论）、followups 2~3 条递进追问、keywords 至少 3 个检索关键词（含岗位特征词）。

  只输出一个 JSON 对象，不要 Markdown 代码块，不要任何多余文字：
  {"questions": [{"question": "...", "reference_points": ["..."], "followups": ["..."], "difficulty": "$difficulty", "type": "...", "keywords": ["..."]}]}
