[project]
name = "offercoach"
version = "0.1.0"
description = "求职面试训练助手：路由式 ReAct/Workflow 双模式执行"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "langgraph>=1.2",
    "langchain-core>=1.0",
    "langchain-deepseek>=1.0",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langfuse>=3.8",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "python-docx>=1.1",
    "qdrant-client>=1.16",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "syrupy>=4.6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
